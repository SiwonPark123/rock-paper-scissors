<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Rock Paper Scissors</title>
    <link rel="styleSheet" type="text/css" href="game.css">
</head>

<body>
    <table>
        <tr>
            <th colspan="3">Rock, Paper, Scissors</th>
        </tr>
        <tr>
            <td class="col1"></td>
            <td class="col2">Make Your Decision!</td>
            <td class="col3"></td>
        </tr>
        <tr>
            <td class="col1">
                <button id="rock">Rock</button>
            </td>
            <td class="col2">
                <button id="paper">Paper</button>
            </td>
            <td class="col3">
                <button id="scissors">Scissors</button>
            </td>
        </tr>
        <tr>
            <td class="col1"></td>
            <td class="col2">
                <button id="submit">Submit</button>
            </td>
            <td class="col3"></td>
        </tr>
    </table>
</body>

</html>
