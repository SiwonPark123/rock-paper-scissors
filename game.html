<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Rock Paper Scissors</title>
    <link rel="styleSheet" type="text/css" href="game.css">
    <script src="game.js"></script>
</head>

<body>
    <table>
        <tr>
            <th colspan="6">Rock, Paper, Scissors</th>
        </tr>
        <tr>
            <td class="col1" colspan="2"></td>
            <td class="col2" colspan="2">Make Your Decision!</td>
            <td class="col3" colspan="2"></td>
        </tr>
        <tr>
            <td class="col1" colspan="2">
                <button id="rock" onclick="selectPlayerChoice(this.id)">Rock</button>
            </td>
            <td class="col2" colspan="2">
                <button id="paper" onclick="selectPlayerChoice(this.id)">Paper</button>
            </td>
            <td class="col3" colspan="2">
                <button id="scissors" onclick="selectPlayerChoice(this.id)">Scissors</button>
            </td>
        </tr>
        <tr>
            <td class="col1" colspan="2"></td>
            <td class="col2" colspan="2">
                <button id="submit" onclick="determineBotChoice(); determineWinner(); displayResult()">Submit</button>
            </td>
            <td class="col3" colspan="2"></td>
        </tr>
        <tr>
            <td>Player Score: </td>
            <td id="playerScore">0</td>
            <td>Result: </td>
            <td id="result"></td>
            <td>Bot Score: </td>
            <td id="botScore">0</td>
        </tr>
    </table>
</body>

</html>
